options:
    output: data/parabolic_slider_2d
    write_freq: 1
    save_output: False
    output_plots: True

grid:
    Lx: 0.1
    Ly: 0.1
    Nx: 128
    Ny: 128
    xE: ['D', 'N', 'N']
    xW: ['D', 'N', 'N']
    yS: ['D', 'N', 'N']
    yN: ['D', 'N', 'N']
    xE_D: 1.1853
    xW_D: 1.1853
    yS_D: 1.1853
    yN_D: 1.1853

geometry:
    type: parabolic_2d
    hmax: 6.6e-5
    hmin: 1.0e-5
    U: 50.
    V: 0.

numerics:
    solver: fem
    dt: 10.
    tol: 0.
    max_it: 30

properties:
    EOS: PL
    shear: 1.846e-5
    bulk: 0.
    P0: 101325
    rho0: 1.1853
    alpha: 0.
    elastic:
        E: 210e09
        nu: 0.3
        alpha_underrelax: 0.2
        reference_point: [0,25]

force_balance:
    pressure: 1e05
    init_dry_contact:
        domain_inlet: 4.5
        domain_outlet: 1.5
        domain_sides: 3.0

fem_solver:
    type: newton_alpha
    linear_solver: iterative
    max_iter: 1
    R_norm_tol: 1e-06
    pspg_boundary_decay: 2.0
    physics:
        pspg: true
        gls: true