# 2D Couette Flow Validation
# Shear-driven flow with stationary bottom wall and moving top wall
# Tests in-plane viscous diffusion (R23xy, R23yx) with wall velocity BC

grid:
    Lx: 0.5
    Ly: 0.25
    Nx: 20
    Ny: 50
    xW: ['P', 'P', 'P']
    xE: ['P', 'P', 'P']
    yS: ['N', 'D', 'D']
    yN: ['N', 'D', 'D']
    yS_D: [null, 0.0, 0.0]    # South wall stationary (jx=0, jy=0)
    yN_D: [null, 1.0, 0.0]    # North wall moving (jx=ρ*U=1*1=1, jy=0)

geometry:
    type: inclined
    hmin: 1.0
    hmax: 1.0
    U: 0.0
    V: 0.0

numerics:
    solver: fem
    dt: 0.01
    tol: 1e-10
    max_it: 1000

properties:
    EOS: PL
    rho0: 1.0
    P0: 1.0
    shear: 0.1
    bulk: 0.
    alpha: 1e-8
    force_x: 0.0
    force_y: 0.0

fem_solver:
    type: newton_alpha
    dynamic: True
    alpha: 1.0
    R_norm_tol: 1e-8
    linear_solver: direct
    max_iter: 5
    physics:
        gap_shear: False
        plane_shear: True
        pspg: False
        gls: False

options:
    output: /tmp/couette_2d_test
    write_freq: 100
    save_output: False
