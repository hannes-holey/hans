# 2D Poiseuille Flow Validation
# Body force driven flow with periodic x, no-slip y walls
# Tests in-plane viscous diffusion (R23xy, R23yx) without wall stress terms

grid:
    Lx: 0.5
    Ly: 0.25
    Nx: 20
    Ny: 50
    xW: ['P', 'P', 'P']       # Periodic west
    xE: ['P', 'P', 'P']       # Periodic east
    yS: ['N', 'D', 'D']       # South wall: Neumann rho, Dirichlet jx=jy=0
    yN: ['N', 'D', 'D']       # North wall: Neumann rho, Dirichlet jx=jy=0
    yS_D: 0.0
    yN_D: 0.0

geometry:
    type: inclined
    hmin: 1.0
    hmax: 1.0
    U: 0.0
    V: 0.0

numerics:
    solver: fem
    dt: 1.0
    tol: 1e-10
    max_it: 30

properties:
    EOS: PL
    rho0: 1.0
    P0: 1.0
    shear: 0.1
    bulk: 0.
    alpha: 1e-8
    force_x: 1           # Body force in x (drives flow)
    force_y: 0.0

fem_solver:
    type: newton_alpha
    dynamic: True
    alpha: 0.8
    R_norm_tol: 1e-8
    max_iter: 1
    solver: direct
    physics:
        gap_shear: False
        plane_shear: True
        body_force: True
    newton_debug: False

options:
    output: /tmp/poiseuille_2d_test
    write_freq: 1
    save_output: True
    output_plots: True

