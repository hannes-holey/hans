# 2D Parabolic slider bearing — Fischer-Burmeister cavitation
#
# Geometry: parabolic gap (hmin=2.54e-5 m, hmax=5.08e-5 m), U=0.7 m/s
# Square domain, Dirichlet p=101325 Pa on all four boundaries.
#
# Fluid: Dowson-Higginson EOS
#   rho0 = 877.7007 kg/m³  at  P0 = 101325 Pa
#   p_cav = 0 Pa
#   shear = 0.039 Pa·s

options:
    output: /tmp/parabolic_2D
    write_freq: 10
    save_output: False
    output_plots: False
    residual_analysis: False

grid:
    Lx: 0.0762
    Ly: 0.0762
    Nx: 100
    Ny: 100
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['D', 'N', 'N']
    yN: ['D', 'N', 'N']
    xW_P: 101325
    xE_P: 101325
    yS_P: 101325
    yN_P: 101325

geometry:
    type: parabolic_2d
    hmin: 2.54e-5
    hmax: 5.08e-5
    U: 0.7
    V: 0.0

numerics:
    solver: fem
    dt: 0.1
    tol: 1e-14
    max_it: 40

properties:
    EOS: DH
    rho0: 877.7007
    P0: 101325
    C1: 3.5e10
    C2: 1.23
    p_cav: 0
    shear: 0.039
    bulk: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.2
    equations:
        cavitation: True
    physics:
        gap_shear: true
        oss_theta: true
    oss_theta_alpha: 2.0
    oss_correction_alpha: 1.0
    max_iter: 1
    R_norm_tol: 1e-9
    scaling: False
