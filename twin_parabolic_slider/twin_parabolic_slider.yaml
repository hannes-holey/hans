# Twin parabolic slider bearing — Bayada cavitation test case
#
# Reference: Bayada et al., "From a compressible fluid model to new mass
#            conserving cavitation algorithms", Fig. 7
#
# Geometry: two symmetric parabolic sliders (hmax at edges, hmin at centre),
#           separated by a flat region at hmax. Profile is constant in y.
#           Topography loaded from file (generated by generate_topography.py).
#
# Domain: Lx = 0.09 m, Ly = 0.004 m (periodic in y, 4 cells)
#   [flat 0.002 | slider1 0.036 | flat_sep 0.010 | slider2 0.036 | flat_out 0.006]
#
# Fluid: Bayada-Chupin EOS (default parameters: oil-like liquid/vapour)
#   rho_l = 850 kg/m³,  rho_v = 0.019 kg/m³
#   c_l   = 1600 m/s,   c_v   = 352 m/s
#   shear = 0.039 Pa·s
#
# Wall velocity: U = 2 m/s

options:
    output: data/twin_parabolic_slider
    write_freq: 1
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.09
    Ly: 0.004
    Nx: 256
    Ny: 4
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_D: 850.0        # inlet density [kg/m³] = rho_l (liquid)
    xE_D: 850.0        # outlet density [kg/m³] = rho_l (liquid)

geometry:
    type: from_file
    filepath: topography/twin_parabolic_slider.npy
    U: 2.0             # wall velocity [m/s]
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 1.0
    tol: 0.0
    max_it: 120

properties:
    EOS: Bayada
    rho_l: 850.0       # liquid density [kg/m³]
    rho_v: 0.019       # vapour density [kg/m³]
    c_l: 1600.0        # liquid speed of sound [m/s]
    c_v: 352.0         # vapour speed of sound [m/s]
    rho0: 850.0        # reference density for initialisation
    shear: 0.039       # dynamic viscosity [Pa·s]
    bulk: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: iterative
    newton_relax: 0.1
    max_iter: 10
    R_norm_tol: 1e-9
    pspg_boundary_decay: 1.0
    physics:
        pspg: true
        gls: false
    pspg_C_I: 1.0
    pressure_stab_alpha: 0.00002
    momentum_stab_alpha: 0.001
    stab_plan: 'pspg+artdiff_fadeout'
    stab_plan_fadeout_start: 10    # time steps before fadeout begins
    stab_plan_fadeout_steps: 50   # steps to linearly ramp tau_mass 1→0
