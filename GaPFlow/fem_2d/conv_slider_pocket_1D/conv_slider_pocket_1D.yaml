# 1D Convergent slider with pocket — Bertocchi et al. (2013) benchmark
#
# Reference geometry from:
#   Bertocchi, L. et al. "Fluid film lubrication in the presence of cavitation:
#   a mass-conserving two-dimensional formulation for compressible, piezoviscous
#   and non-Newtonian fluids." Tribology International 67 (2013), 61–71.
#
# Also used as Study_B in:
#   Hansen, E. et al. "An EHL Extension of the Unsteady FBNS Algorithm."
#   Tribology Letters 70 (2022).
#
# Domain: Lx = 20 mm, periodic in y (effectively 1D).
# Gap: linear convergent wedge (hmax=1.1 µm at inlet, hmin=1.0 µm at outlet)
#      plus a rectangular pocket (depth=0.4 µm, x=[4 mm, 10 mm]).
# Topography is loaded from file (generated by generate_topography.py).
#
# Fluid: Bayada-Chupin EOS (cavitation-capable), parameters matched to DH reference:
#   c_l is set to match the DH speed of sound at rho0:
#     c_l = sqrt(dp/drho|_DH at rho0) = sqrt(C1*(C2-1)/rho0 * ...) ≈ 1989 m/s
#   rho_v, c_v: oil vapour (same as twin parabolic slider)
#   shear = 0.01 Pa·s  (mu0 from Bertocchi, constant — no Barus in GaPFlow)
#
# Wall velocity: U = 1.0 m/s (upper wall), lower wall stationary
# BCs: rho = 850.0099 kg/m³ at inlet/outlet, corresponding to p = 1e5 Pa
#      via Bayada liquid branch: p = Pcav + (rho - rho_l)*c_l^2

options:
    output: data/conv_slider_pocket_1D
    write_freq: 1
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.020
    Ly: 0.004
    Nx: 256
    Ny: 4
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_D: 850.0099  # rho corresponding to p=1e5 Pa via Bayada liquid branch
    xE_D: 850.0099

geometry:
    type: from_file
    filepath: topography/conv_slider_pocket_1D.npy
    U: 1.0
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 0.01
    tol: 0.0
    max_it: 800

properties:
    rho0: 850.
    EOS: Bayada
    rho_l: 850.0       # liquid density [kg/m³]  — matched to DH rho0
    rho_v: 0.019       # vapour density [kg/m³]
    c_l: 5989.28       # liquid speed of sound [m/s] — matched to DH at rho0
    c_v: 352.0         # vapour speed of sound [m/s]
    shear: 0.01        # dynamic viscosity [Pa·s]  (Bertocchi mu0, constant)
    bulk: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.005
    physics:
        gap_shear: true
        plane_shear: true
        inertia: true
    max_iter: 5
    R_norm_tol: 1e-9
    newton_debug: False
    scaling: True
