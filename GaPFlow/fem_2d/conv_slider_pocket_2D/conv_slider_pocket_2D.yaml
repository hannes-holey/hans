# 2D Convergent slider with pocket — Bertocchi et al. (2013) benchmark
#
# Reference: Bertocchi, L. et al. "Fluid film lubrication in the presence of
#   cavitation: a mass-conserving two-dimensional formulation for compressible,
#   piezoviscous and non-Newtonian fluids." Tribology International 67 (2013), 61–71.
#
# Geometry: linear convergent wedge (hmax=1.1 µm at inlet, hmin=1.0 µm at outlet)
#   plus a rectangular pocket (depth=0.4 µm) at x=[4 mm, 11 mm], y=[2 mm, 8 mm].
#   Pocket does not span the full y-width (Ly=10 mm).
#   Topography loaded from file (generated by generate_topography.py).
#
# Domain: Lx = 0.020 m, Ly = 0.010 m
#
# Fluid: Bayada-Chupin EOS with parameters matched to DH reference:
#   rho_l = 850 kg/m³, rho_v = 0.019 kg/m³
#   c_l   = 5989.28 m/s, c_v = 352 m/s
#   shear = 0.01 Pa·s (Bertocchi mu0, constant — no Barus in GaPFlow)
#   Pcav ≈ 66116 Pa (from EOS parameters)
#
# Wall velocity: U = 1.0 m/s (upper wall), lower wall stationary
#
# BCs: Dirichlet rho at inlet/outlet:
#   rho_BC = rho_l + (p_amb - Pcav) / c_l^2  for p_amb = 1e5 Pa
#          = 850.000945 kg/m³
#   yS/yN: Neumann (symmetry/solid wall in y)

options:
    output: data/conv_slider_pocket_2D
    write_freq: 1
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.020
    Ly: 0.010
    Nx: 100
    Ny: 50
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['D', 'N', 'N']
    yN: ['D', 'N', 'N']
    xW_D: 850.000945   # rho at p_amb = 1e5 Pa via Bayada liquid branch
    xE_D: 850.000945
    yS_D: 850.000945
    yN_D: 850.000945

geometry:
    type: from_file
    filepath: topography/conv_slider_pocket_2D.npy
    U: 1.0
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 0.01
    tol: 0.0
    max_it: 500

properties:
    rho0: 850.
    EOS: Bayada
    rho_l: 850.0
    rho_v: 0.019
    c_l: 5989.28
    c_v: 352.0
    shear: 0.01
    bulk: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.001
    physics:
        gap_shear: true
        plane_shear: false
        inertia: false
    max_iter: 5
    R_norm_tol: 1e-9
    newton_debug: False
    scaling: True
