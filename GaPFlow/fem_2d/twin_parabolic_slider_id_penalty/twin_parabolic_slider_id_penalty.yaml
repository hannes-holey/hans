# Twin identical parabolic slider — penalty cavitation, Giacopini et al. (2010) benchmark
#
# Same geometry as twin_parabolic_slider_id (Giacopini et al., 2010).
# Cavitation is enforced via a penalty term (R_cav_pen) rather than the
# Bayada mixture EOS.  DH is used with parameters matched to the Bayada
# c_l used in twin_parabolic_slider_id (C1=2.22e9, C2=1.66):
#   c_l = sqrt(C1/rho0 * C2/(C2-1)^2) = 3154.84 m/s at rho0=850
#
# Domain: Lx = 0.1524 m, Ly = 0.004 m (non-periodic in y)
#
# BCs: P1 = 3.36414e5 Pa at inlet  -> rho = 850.05974 kg/m3  (DH inverse)
#      P2 = 0 Pa at outlet         -> rho = 849.97473 kg/m3  (DH inverse)
#      (C1=2.22e9, C2=1.66, rho0=850, P0=1e5)

options:
    output: data/twin_parabolic_slider_id_penalty
    write_freq: 10
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.1524
    Ly: 0.004
    Nx: 1500
    Ny: 2
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['N', 'N', 'N']
    yN: ['N', 'N', 'N']
    xW_D: 877.762383
    xE_D: 877.675

geometry:
    type: from_file
    filepath: topography/twin_parabolic_slider_id_penalty.npy
    U: 4.57
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 0.1
    tol: 0.0
    max_it: 1000

properties:
    P0: 1.0e5
    rho0: 877.7007
    EOS: DH
    C1: 2.22e9
    C2: 1.66
    shear: 0.039
    bulk: 0.0
    p_cav: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.1
    pen_eps: 1.0e12
    physics:
        gap_shear: true
        plane_shear: false
        inertia: true
        pspg: false
        mass_diffusion: false
    mass_diffusion_alpha: 1e-04
    pspg_C_I: 500.
    max_iter: 1
    R_norm_tol: 1e-9
    newton_debug: False
    scaling: True
    line_search: True
    equations:
        term_list:
            - R11x
            - R11y
            - R11Sx
            - R11Sy
            - R1T
            - R21x
            - R21y
            - R22xx
            - R22xy
            - R22yx
            - R22yy
            - R22xxS
            - R22xyS
            - R22yxS
            - R22yyS
            - R24x
            - R24y
            - R2Tx
            - R2Ty
            - R_cav_pen
