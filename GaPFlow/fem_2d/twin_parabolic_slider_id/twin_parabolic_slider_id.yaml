# Twin identical parabolic slider — Giacopini et al. (2010) benchmark
#
# Reference: Giacopini, M. et al. "A mass-conserving complementarity
#   formulation to study lubricant films in the presence of cavitation."
#   J. Tribology 132(4), 041702 (2010).
#
# Geometry: two identical symmetric parabolic sliders (hmax at edges,
#   hmin at centre), each occupying half the domain. No flat regions.
#   Profile is constant in y. Topography loaded from file.
#
# Domain: Lx = 0.0762 m (bearing length a), Ly = 0.004 m (periodic in y)
#
# Fluid: Bayada-Chupin EOS with c_l matched to DH (C1=2.22e9, C2=1.66):
#   c_l = sqrt(C1/rho0 * C2/(C2-1)^2) = 3154.84 m/s
#   rho_l = 850 kg/m³, rho_v = 0.019 kg/m³, c_v = 352 m/s
#   shear = 0.039 Pa·s
#
# Wall velocity: U = 4.57 m/s
#
# BCs: P1 = 3.36414e5 Pa at inlet  -> rho = 850.02746 kg/m³
#      P2 = 0 Pa at outlet         -> rho = 849.99366 kg/m³
#      (via Bayada liquid branch: p = Pcav + (rho - rho_l)*c_l^2)

options:
    output: data/twin_parabolic_slider_id
    write_freq: 10
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.1524
    Ly: 0.004
    Nx: 400
    Ny: 2
    xW: ['D', 'N', 'D']
    xE: ['D', 'N', 'D']
    yS: ['N', 'N', 'D']
    yN: ['N', 'N', 'D']
    yS_D: [0.0, 0.0, 0.0]
    yN_D: [0.0, 0.0, 0.0]
    xW_D: [850.02746, 0.0, 0.0]     # [rho for P1 = 3.36414e5 Pa, _, jy=0]
    xE_D: [849.99366, 0.0, 0.0]     # [rho for P2 = 0 Pa, _, jy=0]

geometry:
    type: from_file
    filepath: topography/twin_parabolic_slider_id.npy
    U: 4.57
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 1.0
    tol: 0.0
    max_it: 5000

properties:
    rho0: 850.02746
    EOS: Bayada
    rho_l: 850.0
    rho_v: 0.019
    c_l: 3154.84        # matched to DH (C1=2.22e9, C2=1.66) at rho0
    c_v: 352.0
    shear: 0.039
    bulk: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.01
    physics:
        gap_shear: true
        plane_shear: false
        inertia: false
        pspg: false
        mass_diffusion: false
    mass_diffusion_alpha: 1e-04
    pspg_C_I: 500.
    max_iter: 1
    R_norm_tol: 1e-9
    newton_debug: False
    scaling: True
    line_search: True
    equations:
        term_list:
            - R11x
            - R11y
            - R11Sx
            - R11Sy
            - R1T
            - R21x
            - R21y
            - R22xx
            - R22xy
            - R22yx
            - R22yy
            - R22xxS
            - R22xyS
            - R22yxS
            - R22yyS
            - R24x
            - R24y
            - R2Tx
            - R2Ty
