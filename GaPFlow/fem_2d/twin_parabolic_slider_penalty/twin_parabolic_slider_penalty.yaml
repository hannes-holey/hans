# Twin parabolic slider bearing — penalty cavitation with Dowson-Higginson EOS
#
# Same geometry as the Bayada twin_parabolic_slider test case.
# Cavitation is enforced via a penalty term (R_cav_pen) rather than the
# Bayada mixture EOS.  DH is used as a single-branch smooth bulk EOS.
#
# Domain: Lx = 0.09 m, Ly = 0.004 m (periodic in y, 2 cells)
#   [slider1 (parabola) | flat_sep | slider2 (parabola) | flat_outlet]
#
# Wall velocity: U = 2 m/s
#
# DH parameters: C1 = 3.5e8, C2 = 1.23 (same as parabolic_slider_penalty)

options:
    output: data/twin_parabolic_slider_penalty
    write_freq: 1
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.09
    Ly: 0.004
    Nx: 800
    Ny: 2
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_D: 850.0
    xE_D: 850.0

geometry:
    type: from_file
    filepath: topography/twin_parabolic_slider_penalty.npy
    U: 2.
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 0.08
    tol: 0.
    max_it: 1000

properties:
    P0: 1.0e5
    rho0: 850.
    EOS: DH
    C1: 3.5e8
    C2: 1.23
    shear: 0.039
    bulk: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.01
    pen_eps: 1.0e12
    physics:
        gap_shear: true
        plane_shear: false
        inertia: true
    max_iter: 1
    R_norm_tol: 0.
    newton_debug: False
    scaling: True
    equations:
        term_list:
            - R11x
            - R11y
            - R11Sx
            - R11Sy
            - R1T
            - R21x
            - R21y
            - R22xx
            - R22xy
            - R22yx
            - R22yy
            - R22xxS
            - R22xyS
            - R22yxS
            - R22yyS
            - R24x
            - R24y
            - R2Tx
            - R2Ty
            - R_cav_pen
