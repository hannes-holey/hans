# Circular EHL contact — Bayada cavitation test case
#
# Reference: Bayada et al., high-loading EHL with dry-contact initialization
#            and PID-controlled force balance.
#
# Geometry: circular contact patch, Rx = Ry = 15 mm, hmin = 1 µm.
#           Topography generated by dry-contact solve (init_dry_contact).
#
# Domain: Lx = Ly = 2 mm, 128×128 cells.
#   All boundaries: Dirichlet density, Neumann flux.
#
# Fluid: Bayada-Chupin EOS (oil-like liquid/vapour)
#   rho0  = 850 kg/m³,  shear = 0.039 Pa·s
#   c_l   = 1600 m/s,   c_v   = 352 m/s
#
# Wall velocity: U = 100 m/s
#
# Force balance: F = 25 N, PID-controlled rigid height variation.

options:
    output: data/circular_Bayada
    write_freq: 1
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.002
    Ly: 0.002
    Nx: 128
    Ny: 128
    xE: ['N', 'N', 'N']
    xW: ['D', 'N', 'N']
    yS: ['N', 'N', 'N']
    yN: ['N', 'N', 'N']
    xE_D: 850.0
    xW_D: 850.0
    yS_D: 850.0
    yN_D: 850.0

geometry:
    type: circular_contact
    Rx: 15.0e-03
    Ry: 15.0e-03
    hmin: 1.0e-6
    U: 10.
    flip: false

numerics:
    solver: fem
    dt: 1.
    tol: 0.
    max_it: 90

properties:
    EOS: Bayada
    rho0: 850.
    rho_l: 850.0
    rho_v: 0.019
    c_l: 1600.0
    c_v: 352.0
    shear: 0.039
    bulk: 0.
    elastic:
        enabled: true
        E: 210.0e9
        nu: 0.3
        alpha_underrelax: 0.1
        reference_point: [0, 25]
        n_images: 0

force_balance:
    force: 25
    pid_hold_tol: 0.05
    init_dry_contact:
        enabled: true
        domain_inlet: 4.5
        domain_outlet: 1.5
        domain_sides: 3.0
    rigid_height_variation:
        enabled: true
        method: PID
        init_min_height: 
        ambient_pressure: 0.0
        Kp: 1.0e-06
        Ki: 1.0e-07
        Kd: 1.0e-07

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.2
    max_iter: 5
    R_norm_tol: 1.0e-09
    physics:
        gap_shear: true
        plane_shear: true
        inertia: false
    scaling: false
