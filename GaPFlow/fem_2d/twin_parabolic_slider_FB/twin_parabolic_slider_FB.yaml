# Twin parabolic slider — Fischer-Burmeister cavitation
#
# Same geometry as twin_parabolic_slider (non-identical sliders, Bayada et al.)
# but using DH EOS with FB complementarity constraint instead of the Bayada EOS.
#
# Geometry: two symmetric parabolic sliders separated by a flat region,
#   loaded from topography file (generated by twin_parabolic_slider/generate_topography.py).
#   Profile is constant in y.
#
# Domain: Lx = 0.09 m, Ly = 0.004 m
#
# Fluid: Dowson-Higginson EOS
#   rho0 = 877.7007 kg/m³  at  P0 = 101325 Pa
#   p_cav = 0 Pa  (vacuum cavitation)
#   shear = 0.039 Pa·s
#
# BCs: xW Dirichlet rho at ambient (P = 101325 Pa -> rho = rho0 = 877.7007)
#      xE Neumann (FB handles cavitation at outlet)
#      y: periodic

options:
    output: data/twin_parabolic_slider_FB
    write_freq: 10
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.09
    Ly: 0.004
    Nx: 800
    Ny: 2
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_D: 877.7008
    xE_D: 877.7008

geometry:
    type: from_file
    filepath: topography/twin_parabolic_slider_FB.npy
    U: 2.0
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 0.08
    tol: 0.0
    max_it: 700

properties:
    EOS: DH
    rho0: 877.7008
    P0: 101325
    C1: 3.5e10
    C2: 1.23
    p_cav: 0.0
    shear: 0.039
    bulk: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.1
    equations:
        energy: False
        cavitation: True
    physics:
        gap_shear: true
        plane_shear: false
        inertia: false
        lap_pressure: false
        lap_theta: false
        theta_stab: true
    lap_pressure_alpha: 0.0
    lap_theta_alpha: 0.0
    theta_stab_alpha: 0.001
    max_iter: 1
    R_norm_tol: 1e-9
    newton_debug: False
    scaling: True
    line_search: False
