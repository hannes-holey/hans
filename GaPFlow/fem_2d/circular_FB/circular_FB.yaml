# Circular EHL contact — Fischer-Burmeister cavitation
#
# Circular EHL contact with DH EOS and FB complementarity constraint.
#
# Geometry: circular contact patch, Rx = Ry = 15 mm, hmin = 1 µm.
#           Topography generated by dry-contact solve (init_dry_contact).
#
# Domain: Lx = Ly = 2 mm, 128×128 cells.
#   All boundaries: Dirichlet pressure = 101325 Pa.
#
# Fluid: Dowson-Higginson EOS — matched to reference liquid (rho_l=850, c_l=1600 m/s)
#   rho0  = 850 kg/m³  at  P0 = 101325 Pa
#   C1·C2 = rho_l·c_l² = 2.176e9 Pa  (matched bulk modulus); C2>1 required
#   p_cav = 0 Pa  (vacuum cavitation)
#   shear = 0.039 Pa·s
#
# Wall velocity: U = 10 m/s
#
# Force balance: F = 25 N, PID-controlled rigid height variation.

options:
    output: data/circular_FB
    write_freq: 1
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.002
    Ly: 0.002
    Nx: 128
    Ny: 128
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['D', 'N', 'N']
    yN: ['D', 'N', 'N']
    xW_P: 101325
    xE_P: 101325
    yS_P: 101325
    yN_P: 101325

geometry:
    type: circular_contact
    Rx: 15.0e-03
    Ry: 15.0e-03
    hmin: 1.0e-6
    U: 10.
    flip: false

numerics:
    solver: fem
    dt: 1.
    tol: 0.
    max_it: 1

properties:
    EOS: DH
    rho0: 850.0
    P0: 101325
    C1: 1.624e9
    C2: 1.34
    p_cav: 0.0
    shear: 0.039
    bulk: 0.
    elastic:
        enabled: true
        E: 210.0e9
        nu: 0.3
        alpha_underrelax: 0.1
        reference_point: [0, 25]
        n_images: 0

force_balance:
    force: 25
    pid_hold_tol: 0.05
    init_dry_contact:
        enabled: true
        domain_inlet: 4.5
        domain_outlet: 1.5
        domain_sides: 3.0
    rigid_height_variation:
        enabled: true
        method: PID
        init_min_height:
        ambient_pressure: 0.0
        Kp: 1.0e-06
        Ki: 1.0e-07
        Kd: 1.0e-07

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.2
    p_init: 101325
    equations:
        energy: False
        cavitation: True
    physics:
        gap_shear: true
        plane_shear: false
        inertia: true
        theta_stab: true
    theta_stab_alpha: 0.001
    max_iter: 5
    R_norm_tol: 1.0e-09
    newton_debug: False
    scaling: False
