options:
    output: data/inclined_slider
    write_freq: 1000
    save_output: False
    residual_analysis: True

grid:
    Lx: 0.1
    Ly: 0.1
    Nx: 100
    Ny: 10
    xE: ['D', 'N', 'N']
    xW: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xE_D: 1.1853
    xW_D: 1.1853

geometry:
    type: inclined
    hmax: 6.6e-5
    hmin: 1.0e-5
    U: 50.
    V: 0.

numerics:
    solver: fem
    dt: 10.
    tol: 1e-08
    max_it: 10

properties:
    EOS: PL
    shear: 1.846e-5
    bulk: 0.
    P0: 101325
    rho0: 1.1853
    alpha: 0.

fem_solver:
    type: newton_alpha
    R_norm_tol: 1e-10
    max_iter: 10
    pspg_boundary_decay: 2.0
    physics:
        pspg: true
        gls: true
