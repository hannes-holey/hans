# P2P1 Taylor-Hood Poiseuille flow
# Body force driven flow, periodic x, no-slip y walls
# Used for convergence rate validation

grid:
    Lx: 1.0
    Ly: 1.0
    Nx: 4
    Ny: 4
    xW: ['P', 'P', 'P']
    xE: ['P', 'P', 'P']
    yS: ['N', 'D', 'D']
    yN: ['N', 'D', 'D']
    yS_D: 0.0
    yN_D: 0.0

geometry:
    type: inclined
    hmin: 1.0
    hmax: 1.0
    U: 0.0
    V: 0.0

numerics:
    solver: fem
    dt: 1.0
    tol: 1e-10
    max_it: 2000

properties:
    EOS: PL
    rho0: 1.0
    P0: 1.0
    shear: 1.0
    bulk: 0.0
    alpha: 1e-8
    force_x: 1.0
    force_y: 0.0

fem_solver:
    discretisation: p2p1
    equations:
        energy: false
    physics:
        gap_shear: false
        plane_shear: true
        body_force: true
        inertia: false
    R_norm_tol: 1e-10
    max_iter: 30
    newton_relax: 1.0
    linear_solver: direct

energy_spec:
    cv: 718.0
    T_wall: 300.0

options:
    output: /tmp/poiseuille_p2p1_test
    write_freq: 1000
    save_output: False
