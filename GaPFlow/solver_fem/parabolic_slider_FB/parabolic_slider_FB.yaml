# Parabolic slider bearing — Fischer-Burmeister cavitation test case
#
# Same geometry as the Bayada parabolic slider (parabolic_slider/) but using
# the DH EOS with the FB complementarity constraint instead of the Bayada EOS.
# This allows comparison between the two cavitation approaches on the same
# geometry.
#
# Geometry parameters:
#   hmin = 2.54e-5 m,  hmax = 5.08e-5 m
#   U    = 4.57 m/s
#
# Fluid: Dowson-Higginson EOS
#   rho0  = 877.7 kg/m³  at  P0 = 101325 Pa
#   p_cav = 101325 Pa  (cavitation at ambient pressure)
#   shear = 0.039 Pa·s  (matched to Bayada reference)

options:
    output: data/parabolic_slider_FB
    write_freq: 10
    save_output: True
    output_plots: True
    residual_analysis: True

grid:
    Lx: 0.0762
    Ly: 0.004
    Nx: 256
    Ny: 4
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    #xW_D: 877.7108
    #xE_D: 877.7108
    xW_P: 0
    xE_P: 0

geometry:
    type: parabolic
    hmin: 2.54e-5
    hmax: 5.08e-5
    U: 4.57
    V: 0.

numerics:
    solver: fem
    dt: 0.1
    tol: 0.0
    max_it: 50

properties:
    EOS: DH
    rho0: 877.7007
    P0: 101325
    C1: 3.5e10
    C2: 1.23
    p_cav: 0
    shear: 0.039
    bulk: 0.0

fem_solver:
    type: newton_alpha
    linear_solver: direct
    newton_relax: 0.1
    p_init: 103338.25
    equations:
        energy: False
        cavitation: True
    physics:
        gap_shear: true
        plane_shear: false
        inertia: false
        upwind_theta: false
        theta_stab: false
        oss_theta: false
    oss_theta_alpha: 1.0
    oss_correction_alpha: 1.0
    max_iter: 1
    R_norm_tol: 1e-9
    newton_debug: False
    scaling: True
